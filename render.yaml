# Render Blueprint for the multiplayer server (free web service).
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: david-hlopetki-mp
    runtime: node
    plan: free
    rootDir: mp-server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
